<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" role="img" aria-labelledby="title desc">
  <title id="title">ProbeIQ interview workflow</title>
  <desc id="desc">Animated flow from candidate data to adaptive interview, feedback report, and recruiter review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#F0F9FF" />
      <stop offset="1" stop-color="#ECFDF5" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#164E63" flood-opacity=".12" />
    </filter>
  </defs>
  <rect width="1000" height="220" rx="24" fill="url(#bg)" />
  <path d="M220 110H280M470 110H530M720 110H780" stroke="#67E8F9" stroke-width="4" stroke-linecap="round" />
  <circle r="6" fill="#0891B2">
    <animateMotion dur="3.4s" repeatCount="indefinite" path="M220 110H280M470 110H530M720 110H780" />
  </circle>
  <g filter="url(#shadow)">
    <rect x="35" y="55" width="185" height="110" rx="18" fill="#fff" stroke="#A5F3FC" />
    <rect x="285" y="55" width="185" height="110" rx="18" fill="#fff" stroke="#A5F3FC" />
    <rect x="535" y="55" width="185" height="110" rx="18" fill="#fff" stroke="#A5F3FC" />
    <rect x="785" y="55" width="180" height="110" rx="18" fill="#fff" stroke="#A7F3D0" />
  </g>
  <g fill="#164E63" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="127" y="92" font-size="13" font-weight="700">01</text>
    <text x="127" y="119" font-size="16" font-weight="700">Candidate data</text>
    <text x="127" y="142" font-size="12" fill="#475569">missions + curriculum</text>
    <text x="377" y="92" font-size="13" font-weight="700">02</text>
    <text x="377" y="119" font-size="16" font-weight="700">Adaptive interview</text>
    <text x="377" y="142" font-size="12" fill="#475569">questions + follow-ups</text>
    <text x="627" y="92" font-size="13" font-weight="700">03</text>
    <text x="627" y="119" font-size="16" font-weight="700">Evidence report</text>
    <text x="627" y="142" font-size="12" fill="#475569">scores + transcript</text>
    <text x="875" y="92" font-size="13" font-weight="700" fill="#047857">04</text>
    <text x="875" y="119" font-size="16" font-weight="700">Human review</text>
    <text x="875" y="142" font-size="12" fill="#475569">notes + decision</text>
  </g>
</svg>
