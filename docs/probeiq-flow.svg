<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" role="img" aria-labelledby="title desc">
  <title id="title">ProbeIQ interview workflow</title>
  <desc id="desc">Animated flow from candidate data to adaptive interview, evidence report, and human review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#F0F9FF" />
      <stop offset="1" stop-color="#ECFDF5" />
    </linearGradient>
    <linearGradient id="bgGlow" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#BAE6FD" stop-opacity="0" />
      <stop offset="1" stop-color="#A7F3D0" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="shimmer" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#164E63" flood-opacity=".12" />
    </filter>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="220" rx="24" fill="url(#bg)" />

  <rect width="1000" height="220" rx="24" fill="url(#bgGlow)">
    <animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite" />
  </rect>

  <g>
    <rect width="1000" height="220" fill="url(#shimmer)" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="5.5s" begin="0.8s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" from="-1000 0" to="1000 0" dur="5.5s" repeatCount="indefinite" />
    </rect>
  </g>

  <g stroke="#67E8F9" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M220 110H280M470 110H530M720 110H780" stroke-dasharray="10 12">
      <animate attributeName="stroke-dashoffset" from="0" to="-44" dur="1.1s" repeatCount="indefinite" />
    </path>
    <path d="M220 110H280M470 110H530M720 110H780" stroke="#22D3EE" opacity="0.35" stroke-width="1.5" stroke-dasharray="2 6">
      <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.1s" repeatCount="indefinite" />
    </path>
  </g>

  <g filter="url(#glow)">
    <circle r="6" fill="#0891B2">
      <animateMotion dur="3.4s" repeatCount="indefinite" path="M220 110H280M470 110H530M720 110H780" />
    </circle>
  </g>
  <circle r="14" fill="#0891B2" opacity="0.25">
    <animateMotion dur="3.4s" repeatCount="indefinite" path="M220 110H280M470 110H530M720 110H780" />
    <animate attributeName="r" values="10;18;10" dur="1.2s" repeatCount="indefinite" />
  </circle>

  <g filter="url(#shadow)">
    <rect x="35" y="55" width="185" height="110" rx="18" fill="#fff" stroke="#A5F3FC" stroke-width="2">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.2s" fill="freeze" />
    </rect>
    <rect x="285" y="55" width="185" height="110" rx="18" fill="#fff" stroke="#A5F3FC" stroke-width="2">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.5s" fill="freeze" />
    </rect>
    <rect x="535" y="55" width="185" height="110" rx="18" fill="#fff" stroke="#A5F3FC" stroke-width="2">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.8s" fill="freeze" />
    </rect>
    <rect x="785" y="55" width="180" height="110" rx="18" fill="#fff" stroke="#10B981" stroke-width="2.5">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.1s" fill="freeze" />
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.2s" begin="1.1s" repeatCount="indefinite" />
    </rect>
  </g>
  <rect x="785" y="55" width="180" height="110" rx="18" fill="#10B981" opacity="0.06">
    <animate attributeName="opacity" values="0.06;0.2;0.06" dur="2.2s" begin="1.1s" repeatCount="indefinite" />
  </rect>

  <g fill="#164E63" font-family="Arial, sans-serif" text-anchor="middle">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.4s" fill="freeze" />
      <text x="127" y="92" font-size="13" font-weight="700">01</text>
      <text x="127" y="119" font-size="16" font-weight="700">Candidate data</text>
      <text x="127" y="142" font-size="12" fill="#475569">missions + curriculum</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.7s" fill="freeze" />
      <text x="377" y="92" font-size="13" font-weight="700">02</text>
      <text x="377" y="119" font-size="16" font-weight="700">Adaptive interview</text>
      <text x="377" y="142" font-size="12" fill="#475569">questions + follow-ups</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1s" fill="freeze" />
      <text x="627" y="92" font-size="13" font-weight="700">03</text>
      <text x="627" y="119" font-size="16" font-weight="700">Evidence report</text>
      <text x="627" y="142" font-size="12" fill="#475569">scores + transcript</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.3s" fill="freeze" />
      <text x="875" y="92" font-size="13" font-weight="700" fill="#047857">04</text>
      <text x="875" y="119" font-size="16" font-weight="700">Human review</text>
      <text x="875" y="142" font-size="12" fill="#475569">notes + decision</text>
    </g>
  </g>

  <g>
    <circle cx="127" cy="186" r="4" fill="#22D3EE">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="3.4s" begin="0s" repeatCount="indefinite" />
    </circle>
    <circle cx="377" cy="186" r="4" fill="#22D3EE">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="3.4s" begin="0.85s" repeatCount="indefinite" />
    </circle>
    <circle cx="627" cy="186" r="4" fill="#22D3EE">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="3.4s" begin="1.7s" repeatCount="indefinite" />
    </circle>
    <circle cx="875" cy="186" r="4" fill="#10B981">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="3.4s" begin="2.55s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
